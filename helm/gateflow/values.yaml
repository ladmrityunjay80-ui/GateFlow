replicaCount: 2

image:
  repository: gateflow
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
  hosts:
    - api.gateflow.example.com
  tls:
    - secretName: gateflow-tls
      hosts:
        - api.gateflow.example.com

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: true
  minAvailable: 1

externalSecrets:
  enabled: false
  secretStoreRef:
    name: ""
    kind: SecretStore
  refreshInterval: 1h
  references:
    adminKey: ""
    keySecret: ""
    webhookSigningSecret: ""

nodeSelector: {}
tolerations: []
affinity: {}

config:
  app_name: GateFlow
  debug: "false"
  forwarded_allow_ips: ""
  cors_origins: ""
  admin_key: ""
  admin_read_keys: ""
  admin_rate_limit_enabled: "true"
  admin_rate_limit_capacity: "30"
  admin_rate_limit_refill_rate: "1.0"
  key_secret: ""
  key_secret_versions: ""
  redis_url: "redis://redis.gateflow.svc.cluster.local:6379/0"
  redis_sentinels: ""
  redis_service_name: "mymaster"
  redis_health_check_interval: "30"
  notification_worker_enabled: "true"
  notification_webhook_url: ""
  webhook_signing_secret: ""
  global_rate_limit_enabled: "false"
  global_rate_limit_capacity: "10000"
  global_rate_limit_refill_rate: "1000.0"

secrets:
  admin_key: ""
  key_secret: ""
  webhook_signing_secret: ""
