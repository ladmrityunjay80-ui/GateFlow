name: GateFlow CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Lint with ruff
        run: ruff check . --output-format=github
      - name: Type check with mypy
        run: mypy gateflow/
      - name: Security scan with bandit
        run: bandit -r gateflow/ -f json -o bandit-report.json
      - name: Dependency audit with pip-audit
        run: pip-audit --desc
      - name: ML training / retraining smoke test
        run: |
          python scripts/train_anomaly_model.py --values 1.0 2.0 3.0 100.0 --output /tmp/anomaly.joblib
          printf '{"duration_ms": "10"}\n{"duration_ms": "5000"}\n' > /tmp/metrics.jsonl
          python scripts/retrain_anomaly_model.py --jsonl /tmp/metrics.jsonl --output /tmp/anomaly_retrain.joblib
      - name: Run test suite with coverage gate
        env:
          GATEFLOW_TEST_REDIS_URL: redis://localhost:6379/15
          GATEFLOW_KEY_SECRET: gateflow-ci-secret
        run: python -m pytest -v --cov=gateflow --cov-report=term-missing --cov-fail-under=80
      - name: mTLS and CORS checks
        env:
          GATEFLOW_TEST_REDIS_URL: redis://localhost:6379/15
          GATEFLOW_KEY_SECRET: gateflow-ci-secret
        run: python -m pytest -v tests/test_mtls.py tests/test_main.py -k "mtls or cors"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.20.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t gateflow:ci .
      - name: Smoke test image
        run: |
          docker run --rm -e GATEFLOW_REDIS_URL=redis://host.docker.internal:6379/0 gateflow:ci python -m compileall -q /app
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.20.0
        with:
          image-ref: gateflow:ci
          severity: HIGH,CRITICAL
          exit-code: 1

  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack
        run: docker compose up -d
      - name: Wait for GateFlow
        run: |
          for i in {1..30}; do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
      - name: Run k6 smoke load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/load/smoke.js
      - name: Stop stack
        if: always()
        run: docker compose down -v

  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start HA stack
        run: docker compose -f docker-compose.ha.yml up -d
      - name: Wait for GateFlow
        run: |
          for i in {1..60}; do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
      - name: Seed sample data
        run: |
          GATEFLOW_REDIS_URL=redis://localhost:6379/0 python -m scripts.seed
      - name: Run Redis Sentinel failover chaos test
        run: |
          GATEWAY_URL=http://localhost:8080 \
          GATEFLOW_MASTER_CONTAINER=gateflow_redis_master \
          python -m tests.chaos.sentinel_failover
      - name: Stop HA stack
        if: always()
        run: docker compose -f docker-compose.ha.yml down -v
