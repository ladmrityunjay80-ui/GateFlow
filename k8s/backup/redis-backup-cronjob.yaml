apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: gateflow
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          containers:
            - name: backup
              image: redis:7-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATE=$(date +%Y%m%d-%H%M%S)
                  redis-cli -h redis -p 6379 --rdb /backup/dump-${DATE}.rdb
                  echo "Backup completed: dump-${DATE}.rdb"
                  # Keep only the last 7 backups.
                  ls -1t /backup/dump-*.rdb | tail -n +8 | xargs -r rm -f
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: redis-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-backup
  namespace: gateflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
